# 静态站统一部署（push-to-deploy），由 39.107 上 self-hosted runner 执行
# runner 用自身 /root/.ssh/id_rsa 登录 60.205.214.88，无需在仓库存密钥
# 实际部署目录为 /www/wwwroot/img.fangkelianmeng.com
name: Deploy img.fangkelianmeng.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, static-deploy]
    steps:
      - name: Configure SSH for GitHub checkout
        shell: bash
        run: |
          git config --system url."git@github.com:".insteadOf "https://github.com/"
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null
      - uses: actions/checkout@v4
      - name: Encoding gate (UTF-8 only)
        shell: bash
        run: |
          # 十站统一编码门禁（静态网站字符编码规范）：非 UTF-8/带 BOM 即中断部署，防乱码上线
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/check-encoding.js
      - name: Build (cache-bust ?v + prerender landing pages)
        shell: bash
        run: |
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          echo "[info] node: $NODE ($($NODE -v))"
          # 预渲染分类/详情落地页 + 扩量 sitemap；API 不可达时降级为仅重写主页面（不阻断部署）
          $NODE scripts/build.js || echo "[warn] build.js 降级：API 不可达，保留仓库原页面"
      - name: Apply unified site shell (footer / about / ads / cross-links)
        shell: bash
        run: |
          # 展示层统一规范：build.js（?v= 盖章 + 预渲染）之后的最后一步，产物不入库
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/apply-site-shell.js
          $NODE scripts/apply-site-shell.js --check
      - name: Sync to /www/wwwroot/img.fangkelianmeng.com
        shell: bash
        run: |
          tar cf - --exclude=.git --exclude=.github --exclude=.user.ini --exclude=.workbuddy --exclude=deploy . | ssh -i /root/.ssh/id_rsa -o StrictHostKeyChecking=accept-new root@60.205.214.88 "mkdir -p /www/wwwroot/img.fangkelianmeng.com ; cd /www/wwwroot/img.fangkelianmeng.com ; tar xmf -"
