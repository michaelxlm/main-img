# 静态站统一部署（push-to-deploy），由 39.107 上 self-hosted runner 执行
# runner 用自身 /root/.ssh/id_rsa 登录 60.205.214.88，无需在仓库存密钥
# 实际部署目录为 /www/wwwroot/img.fangkelianmeng.com
name: Deploy img.fangkelianmeng.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, static-deploy]
    steps:
      - name: Configure SSH for GitHub checkout
        shell: bash
        run: |
          git config --system url."git@github.com:".insteadOf "https://github.com/"
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null
      - uses: actions/checkout@v4
      - name: Fetch packages single-source (remote prune scripts)
        shell: bash
        run: |
          # 远端收尾腿脚本的事实源在 packages/static-build-kit/src/（本站无 npm 依赖，只浅克隆取脚本）
          TOP="$(dirname "$GITHUB_WORKSPACE")"
          rm -rf "$TOP/packages"
          git clone --depth 1 git@github.com:michaelxlm/packages.git "$TOP/packages"
      - name: Encoding gate (UTF-8 only)
        shell: bash
        run: |
          # 十站统一编码门禁（静态网站字符编码规范）：非 UTF-8/带 BOM 即中断部署，防乱码上线
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/check-encoding.js
      - name: Fetch SEO enhance JSON (M4 / WO-227~230)
        shell: bash
        # 中台已采纳建议 → 构建期注入 JSON-LD（sites['main-img']）。fail-soft：失败保留上次产物，不阻断部署。
        run: |
          mkdir -p data
          curl -fsSL --retry 3 -o data/seo-enhance.json.tmp \
            https://antucao.oss-cn-beijing.aliyuncs.com/json/seoEnhance.json \
            && mv data/seo-enhance.json.tmp data/seo-enhance.json \
            || echo "[warn] SEO enhance 拉取失败，沿用本地 data/seo-enhance.json（或留空）"
      - name: Build (cache-bust ?v + prerender landing pages)
        shell: bash
        run: |
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          echo "[info] node: $NODE ($($NODE -v))"
          # WO-155：预渲染列表页/分类页/详情页 + 产物门禁。API 失败时沿用上次产物，
          # 但门禁失败（首屏空、死链、类目页缺失）必须阻断部署。
          $NODE scripts/build.js
      - name: Apply unified site shell (footer / about / ads / cross-links)
        shell: bash
        run: |
          # 展示层统一规范：build.js（?v= 盖章 + 预渲染）之后的最后一步，产物不入库
          NODE=/www/server/nodejs/v20.18.3/bin/node
          [ -x "$NODE" ] || NODE=node
          $NODE scripts/apply-site-shell.js
          $NODE scripts/apply-site-shell.js --check
      - name: Sync to /www/wwwroot/img.fangkelianmeng.com
        shell: bash
        run: |
          tar cf - --exclude=.git --exclude=.github --exclude=.user.ini --exclude=.workbuddy --exclude=deploy . | ssh -i /root/.ssh/id_rsa -o StrictHostKeyChecking=accept-new root@60.205.214.88 "mkdir -p /www/wwwroot/img.fangkelianmeng.com ; cd /www/wwwroot/img.fangkelianmeng.com ; tar xmf -"
      - name: Ensure /p/ 200 fallback (nginx, idempotent)
        shell: bash
        run: |
          # 硬约束：删远端过期页之前，nginx 生效配置里必须有 location ^~ /p/ { try_files $uri /p/_shell.html; }
          # 线上已有则完全不动；缺失才备份落位 → nginx -t → reload → 复验（不存在键须 200 + 壳标记）→ 失败即回滚
          TOP="$(dirname "$GITHUB_WORKSPACE")"
          SRC="$TOP/packages/static-build-kit/src"
          HOST=root@60.205.214.88
          KEY="-i /root/.ssh/id_rsa -o StrictHostKeyChecking=accept-new"
          scp $KEY "$SRC/remote-ensure-fallback.sh" "$HOST:/tmp/remote-ensure-fallback.sh"
          scp $KEY deploy/nginx-p-fallback.conf "$HOST:/tmp/p-fallback.conf"
          ssh $KEY "$HOST" 'FALLBACK_DIRS=p FALLBACK_CONF=/tmp/p-fallback.conf FALLBACK_EXT_DIR=/www/server/panel/vhost/nginx/extension/img.fangkelianmeng.com FALLBACK_HOST=img.fangkelianmeng.com bash /tmp/remote-ensure-fallback.sh'
      - name: Remote prune (authoritative sitemap diff)
        shell: bash
        run: |
          # 收尾腿：CI 的 tar 同步是增量覆盖（只增不删），构建期清退掉的旧详情页仍残留在服务器上返回 200。
          # 以线上 sitemap.xml 为权威清单做差集，只删「磁盘有、清单无」且文件名命中正则的页（幂等，差集为 0 时无事发生）。
          TOP="$(dirname "$GITHUB_WORKSPACE")"
          SRC="$TOP/packages/static-build-kit/src"
          HOST=root@60.205.214.88
          KEY="-i /root/.ssh/id_rsa -o StrictHostKeyChecking=accept-new"
          scp $KEY "$SRC/remote-prune.sh" "$HOST:/tmp/remote-prune.sh"
          ssh $KEY "$HOST" 'PRUNE_ROOT=/www/wwwroot/img.fangkelianmeng.com PRUNE_DIRS=p PRUNE_PATTERN="^[0-9a-f]{32}[.]html$" PRUNE_HOST=img.fangkelianmeng.com bash /tmp/remote-prune.sh'
