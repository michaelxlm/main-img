# 小满美图（img.fangkelianmeng.com）Nginx 配置参考
# 部署时复制到 /etc/nginx/conf.d/img-fangkelianmeng.conf 并调整路径

server {
    listen 80;
    server_name img.fangkelianmeng.com;
    root /var/www/main-img;
    index index.html;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 静态资源长缓存（文件名含 ?v= 令牌）
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 短缓存 + 必须验证
    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    # SPA 兜底：所有未匹配路径返回 404.html
    location / {
        try_files $uri $uri/ /404.html;
    }

    # 图片域名反代（可选：如果图片不走 CDN 而需要本站代理）
    # location /img/ {
    #     proxy_pass https://antucao.oss-cn-beijing.aliyuncs.com/;
    #     proxy_set_header Host antucao.oss-cn-beijing.aliyuncs.com;
    # }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
}
