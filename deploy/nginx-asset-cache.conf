# ===== WO-209 缓存二分法 · css/js 指纹资产 1 年 immutable =====
# 落位：/www/server/panel/vhost/nginx/extension/img.fangkelianmeng.com/cache-long.conf
# 仓库单源：main-img/deploy/nginx-asset-cache.conf（线上落位见上一行）
# 回滚：删除本文件 -> nginx -t -> nginx -s reload（不动宝塔主配置，可安全回退）
# 依据（2026-11-16 线上 nginx -T 实测）：
#   主配置 html_img.fangkelianmeng.com.conf 的 `location ~ .*\.(js|css)?$ { expires 12h; }`
#   位于本 extension include 之后；正则 location 按出现顺序取首个命中，故本片段优先生效。
# 范围：只覆盖 css/js —— 这两类引用由 build.js 盖 ?v=<内容哈希>，改版即换 URL；
#   图片/字体不在本轮（未确认全站版本化，长缓存会钉死旧图），沿用主配置 30d / 回源。
# 头继承：location 内出现 add_header 会整体丢弃 server 层 add_header，故用 include
#   原样继承 5 项基线安全头（不复制文本，杜绝两处漂移）；HSTS 只对文档导航有意义，资产不发。
# 写法：只用 add_header Cache-Control 并显式 expires off —— 本目录 cache.conf 在 server 级
#   有 expires -1，若不 off 会多发一条 Cache-Control: no-cache 与该行并存（2026-11-16 实踩）。
location ~* \.(?:css|js)$ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /www/server/panel/vhost/nginx/extension/img.fangkelianmeng.com/security-headers.conf;
    access_log off;
    error_log /dev/null;
}
