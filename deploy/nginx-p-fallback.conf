# img.fangkelianmeng.com · /p/ 图片详情页：静态优先 + 回退壳（同 URL 恒不 404）
#
# 仓库单源：main-img/deploy/nginx-p-fallback.conf
# 线上落位：/www/server/panel/vhost/nginx/extension/img.fangkelianmeng.com/p-fallback.conf
# 生效前提：主配置 html_img.fangkelianmeng.com.conf 里已 include extension/<site>/*.conf（宝塔默认注入）。
# 应用：scp 上去 -> nginx -t -> nginx -s reload
# 回滚：删除本文件 -> nginx -t -> nginx -s reload（不动宝塔主配置，可安全回退）
#
# 为什么需要：CI 同步是 `tar xmf -` 增量覆盖（只增不删），构建期 build.js 清退掉的旧详情页
#   仍残留在服务器上继续对外返回 200（实测：磁盘 p/ 380 张，线上 sitemap 只 121 条）。
#   本片段让「已不在精选集」的旧 /p/<id> 回退到 /p/_shell.html（200），删除旧页也不产生 404 坏链。
# ^~ 前缀必需：否则被主配置的 location ~ .*\.(js|css)?$ 等正则抢匹配，缺失文件直接 404。
# 只用 expires 不用 add_header：nginx 的 add_header 是「就近整体覆盖」——location 内一旦出现
#   add_header，server 级安全头（nosniff / CSP / Referrer-Policy / Permissions-Policy）会被整体丢弃。
location = /p/_shell.html {
    expires -1;
}
location ^~ /p/ {
    try_files $uri /p/_shell.html;
    expires -1;
}